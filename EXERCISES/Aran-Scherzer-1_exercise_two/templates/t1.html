{% extends "base.html" %}

{% block content %}
<!-- page heading -->
<section class="page-heading">
    <h3>Top Result</h3>
    <p>Search the NASA archive and see the best match, with its description.</p>
</section>
<section class="search-box">
    <!-- GET request: the text is sent to the server as ?search_term=... -->
    <form action="{{ url_for('getSearchCriteria') }}" method="GET">
        <label for="search_term">NASA API SEARCH CRITERIA:</label>
        <div class="search-fields">
            <input type="text" id="search_term" name="search_term" placeholder="search for ..." required>
            <input type="submit" value="submit search">
        </div>
    </form>
</section>

<!-- only shown when the server found a result -->
{% if have_results %}
<section class="result-single">
    <p class="result-description">{{ description }}</p>
    <img src="{{ imgPath }}" alt="NASA image result">
</section>
{% endif %}
{% endblock %}
